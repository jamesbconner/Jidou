[project]
name = "jidou"
version = "0.1.0"
description = "Jidou project"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "Jidou Team" },
]
dependencies = [
    # CLI
    "click>=8.4.2",
    "rich>=13.7",
    # Validation
    "pydantic>=2.9",
    "pydantic-settings>=2.14.2",
    # Web framework
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.32",
    "websockets>=17.0.1",
    # Database
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.18.5",
    # Task queue
    "celery[redis]>=5.4",
    # Redis
    "redis>=5.2",
    "hiredis>=2.3",
    # SFTP
    "asyncssh>=2.24.0",
    "aiohttp>=3.14.3",
    # Logging
    "structlog>=24.4",
    # Caching
    "cachetools>=7.1.7",
    "python-multipart>=0.0.32",
    "rapidfuzz>=3.14.5",
    "httpx2>=2.9.1",
]

[project.optional-dependencies]
dev = [
    # --- Testing ---
    "pytest>=9.1.1",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.165.0",

    # --- Linting / Formatting ---
    "ruff>=0.16.1",
    "mypy>=2.3.0",

    # --- Build / Publish ---
    "build>=1.2",
    "twine>=5.1",

    # --- Security ---
    "bandit>=1.7.9",

    # --- Pre-commit hooks ---
    "pre-commit>=4.6.1",
]

[project.scripts]
jidou = "jidou.main:main"
jidou-make = "make:cli"

[project.urls]
Repository = "https://github.com/jamesbconner/jidou"
Issues = "https://github.com/jamesbconner/jidou/issues"

[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "F",      # pyflakes
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "UP",     # pyupgrade
    "I",      # isort
    "N",      # pep8-naming
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific rules
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "asyncssh.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "celery.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "redis.*"
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "redis.asyncio"
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers", "-v"]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    "ignore:websockets.*is deprecated:DeprecationWarning",
    "ignore:unclosed:ResourceWarning",
    "ignore:loop is closed:ResourceWarning",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 70

[tool.hatch.build.targets.wheel]
packages = ["src/jidou"]

[tool.bandit]
exclude_dirs = ["tests"]
